name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck (shell scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck install.sh uninstall.sh macos/build.sh

  ruff:
    name: ruff (python lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          # Match the pyproject dev pin: the action installs the newest ruff by
          # default, whose wider default rules would red the build on untouched code.
          version: ">=0.16.4,<0.17"
