[project]
name = "infogrep"
dynamic = ["version"]   # single source of truth: infogrep/__init__.py
description = "Local-first content search engine (sparse + dense + knowledge base) for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Qingyao Ai", email = "aiqingyao@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "typer>=0.12",
    "tomli>=2.0; python_version < '3.11'",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pathspec>=1.1.1",
    "pyjnius>=1.6.1",
    "mcp>=1.28.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
# Semantic (embedding) search. Pulls in torch — sparse/graph/kb search work without it,
# so the base install stays small. The Anserini jar for sparse search is fetched on
# first use (see infogrep/anserini.py), not installed via pip.
dense = [
    "zvec>=0.5.1",
    "sentence-transformers>=5.6.0",
]
dev = [
    "pytest>=8.0",
    # Pinned to a minor series: ruff widens its default rule set between minors, so an
    # unpinned CI would lint against different rules than the local run.
    "ruff>=0.16.4,<0.17",
]

[project.urls]
Homepage = "https://qingyaoai.github.io/InfoGrep/"
Repository = "https://github.com/QingyaoAi/InfoGrep"
Issues = "https://github.com/QingyaoAi/InfoGrep/issues"

[project.scripts]
infogrep = "infogrep.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "infogrep/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["infogrep"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Ruff's default rule set widens between releases, so CI — which installs the newest
# ruff — drifts away from the pinned local one and goes red on code nobody touched.
# The version is pinned (dev dependency and CI action) so both run the same rules; these
# are the ones this codebase deliberately does not follow.
[tool.ruff.lint]
ignore = [
    # Typer's whole API is `arg: T = typer.Option(...)` in the signature — the call in
    # the default is the framework's contract, not an accident. Fixing this would mean
    # rewriting every CLI command and losing the generated --help.
    "B008",
    # Deliberate. Indexing catches broadly on purpose: a failing extractor, a JVM/Lucene
    # problem, or an embedding backend must never take down a run or lose the manifest —
    # the error is recorded in the report and the index survives. Narrowing these to
    # specific exception types would trade that guarantee for a lint score.
    "BLE001",
    # Best-effort cleanup and probe paths where the failure genuinely is the answer
    # (feature unavailable, optional dependency missing) and there is nothing to log.
    "S110", "S112",
    # Would rewrite the curated stopword/label word lists — grouped over several lines,
    # with CJK terms alongside their English counterparts — into single 700-character
    # list literals. The `"...".split()` form is what makes them reviewable.
    "SIM905",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
